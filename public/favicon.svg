<!-- SVG LOGO MÖSSA - VERSIÓ AMB ESTIL -->
<svg 
  width="48" 
  height="48" 
  viewBox="0 0 48 48" 
  fill="none" 
  xmlns="http://www.w3.org/2000/svg"
  class="w-10 h-10 md:w-12 md:h-12"
>
  <!-- Rectangle de fons amb cantonades arrodonides (bg-[#b6c9a0]) -->
  <rect width="48" height="48" rx="12" fill="#B6C9A0"/>
  
  <!-- Ombra subtil (efecte shadow-md) -->
  <rect width="48" height="48" rx="12" fill="black" fill-opacity="0.1" filter="url(#shadow)"/>
  
  <!-- Lletra M estilitzada -->
  <path 
    d="M16 15V33M16 15L24 24L32 15M32 15V33" 
    stroke="white" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    stroke-opacity="0.95"
  />
  
  <!-- Definició de l'ombra -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
</svg>